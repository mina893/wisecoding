<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>인스타그램 주소 설정 | 와이즈코딩</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3ff;color:#172638;font:16px/1.8 system-ui,sans-serif}main{max-width:620px;margin:50px auto;padding:32px;background:#fff;border-radius:16px}h1{font-size:26px;line-height:1.5}label{display:block;margin:24px 0 8px;font-weight:700}input{width:100%;padding:14px;border:1px solid #9fadc5;border-radius:6px;font:inherit}button{margin-top:24px;padding:14px 22px;border:0;border-radius:6px;background:#2953cc;color:white;font:inherit;cursor:pointer}p{color:#526073}#status{color:#234aa2}a{color:#2953cc}@media(max-width:650px){main{margin:20px 12px;padding:24px}}</style></head><body><main><h1>인스타그램 주소 설정</h1><p>주소를 입력해 설정 파일을 다운로드한 뒤, GitHub 저장소에 덮어 올려주세요. 이 화면에서 입력하는 것만으로 홈페이지가 변경되지는 않습니다.</p><form id="settings"><label for="instagram">인스타그램 주소</label><input id="instagram" type="url" placeholder="https://www.instagram.com/계정이름/" autocomplete="off"><p>빈칸으로 두면 해당 메뉴는 ‘준비 중’으로 표시됩니다.</p><button type="submit">설정 파일 다운로드</button></form><p id="status" role="status"></p><p>다운로드한 <strong>channels.js</strong>를 홈페이지의 index.html과 같은 위치에 올리세요.</p><a href="index.html">홈페이지로 돌아가기</a></main><script src="channels.js?v=instagram"></script><script src="link-settings.js?v=instagram"></script></body></html>
